<h1>近 10 期走势简表</h1>
<div class="sub">数据来自站内开奖记录（新香港）：逐期列出特码、生肖、单双与三肖，再统计近 10 期特码的波色/五行分布。<b>样本只有 10 期，不代表未来走势</b>，仅作历史资料查看。</div>
<div class="block"><div class="hd"><b>近 10 期开奖</b><em id="trend-count">加载中…</em></div><table class="bt" id="trend-table"><colgroup><col style="width:20%"><col style="width:16%"><col style="width:14%"><col style="width:14%"><col style="width:36%"></colgroup><thead><tr><th>期号</th><th>特码</th><th>生肖</th><th>单双</th><th>三肖（主）</th></tr></thead><tbody id="trend-body"><tr><td colspan="5" style="padding:14px"><span class="sk" style="width:70%"></span></td></tr></tbody></table></div>
<div class="block"><div class="hd"><b>特码统计</b><em>仅近 10 期</em></div><div class="rows" id="trend-stats"><div class="row"><i>统计</i><span class="sk" style="width:60%"></span><em class="sk" style="width:50px"></em></div></div></div>
<div class="note">统计口径：只统计近 10 期开奖号码中的第 7 个号码（特码）；单双/三肖取站内记录，波色/五行按号码属性表对应。样本小，请勿据此判断冷热或预测下期。</div>
<div class="nav"><a href="index.html">首页</a><a class="on" href="ziliao.html">资料大全</a><a href="guilv.html">规律走势</a><a href="index.html">寻宝</a><a href="gallery.html">图库</a></div>
<script>
(function(){var S=['https://raw.githubusercontent.com/BYD666-WQ/xingchen-caixun/main/','https://cdn.jsdelivr.net/gh/BYD666-WQ/xingchen-caixun@main/',''];
function get(p){var i=0,NAMES=['raw','jsdelivr','local'];function go(){if(i>=S.length)return Promise.reject(new Error('x'));var k=i;var u=S[i++]+p+'?t='+Date.now();try{window.__dataOrder=window.__dataOrder||[];window.__dataOrder.push({try:NAMES[k]||String(k),path:p});console.log('[data-order] try '+(NAMES[k]||k)+' '+p)}catch(e){}return fetch(u,{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json().then(function(j){try{window.__dataOrder.push({hit:NAMES[k]||String(k),path:p});console.log('[data-order] hit '+(NAMES[k]||k)+' '+p)}catch(e){}return j})}).catch(function(){try{window.__dataOrder.push({fail:NAMES[k]||String(k),path:p})}catch(e){}return go()})}return go()}
function empty(){document.getElementById('trend-body').innerHTML='<tr><td colspan="5" style="padding:14px;color:#8a6a3a">暂无数据（开奖记录未加载）</td></tr>';document.getElementById('trend-count').textContent='暂无数据';document.getElementById('trend-stats').innerHTML='<div class="row"><i>统计</i><span>暂无数据</span><em>—</em></div>'}
Promise.all([get('data/manual-ziliao.json'),get('data/manual-draw.json'),get('data/num-attrs.json')]).then(function(r){
  var zl=r[0]||{},md=r[1]||{},attr=(r[2]&&r[2].rows)||[];
  var amap={};attr.forEach(function(a){amap[a.num]=a});
  var dmap={};if(md.issue&&md.nums)dmap[String(md.issue)]=md.nums;(md.history||[]).forEach(function(h){dmap[String(h.issue)]=h.nums});
  var rows=(zl.rows||[]).filter(function(x){return x.result&&x.result.c&&x.result.c!=='NaN'&&x.status!=='upcoming'}).slice(0,10);
  if(!rows.length){empty();return}
  var cCount={红:0,蓝:0,绿:0},wCount={金:0,木:0,水:0,火:0,土:0},oe={单:0,双:0};
  var body='';
  rows.forEach(function(x){
    var num=('0'+parseInt(x.result.c,10)).slice(-2);
    var arr=dmap[String(x.issue)]||[];var last=arr.length?arr[arr.length-1]:null;
    var a=last||amap[num]||{};
    var color=a.color||'';var wx=a.wuxing||'';
    if(cCount[color]!==undefined)cCount[color]++;
    if(wCount[wx]!==undefined)wCount[wx]++;
    if(oe[x.oddEven]!==undefined)oe[x.oddEven]++;
    var cls=color==='红'?'r':(color==='蓝'?'b':'g');
    body+='<tr class="trend-row"><td><b>'+x.issue+'期</b></td><td><span class="n '+cls+'">'+num+'</span></td><td>'+(x.result.z||'')+'</td><td>'+(x.oddEven||'')+'</td><td style="font-size:13px">'+((x.threeZodiac||[]).join(' '))+'</td></tr>';
  });
  document.getElementById('trend-body').innerHTML=body;
  document.getElementById('trend-count').textContent=rows.length+' 期';
  var stats='<div class="row"><i>单双</i><span>单 '+oe['单']+' 期 · 双 '+oe['双']+' 期</span><em>合计 '+rows.length+' 期</em></div>';
  stats+='<div class="row"><i>波色</i><span>红 '+cCount['红']+' · 蓝 '+cCount['蓝']+' · 绿 '+cCount['绿']+'</span><em>特码</em></div>';
  var wxList=[];['金','木','水','火','土'].forEach(function(w){if(wCount[w])wxList.push(w+' '+wCount[w])});
  stats+='<div class="row"><i>五行</i><span>'+wxList.join(' · ')+'</span><em>特码</em></div>';
  document.getElementById('trend-stats').innerHTML=stats;
  window.__trend={rows:rows.length,oe:oe,color:cCount,wuxing:wCount};
}).catch(empty)})();
</script>
