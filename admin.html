<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>星辰彩讯 · 手动开奖管理</title>
<link rel="stylesheet" href="assets/css/site.css">
<style>
body{margin:0;background:#f2f4f3;font:14px/1.6 "Microsoft YaHei",Arial,sans-serif;color:#333}
.wrap{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:18px;margin:8px 0 4px;color:#07a35a}
.hint{color:#888;font-size:12px;margin-bottom:12px}
label{display:block;margin:10px 0 4px;font-weight:700}
input,select{width:100%;height:44px;padding:0 10px;border:1px solid #d8d8d8;border-radius:6px;box-sizing:border-box;font-size:15px}
button{width:100%;height:48px;margin-top:16px;border:0;border-radius:6px;background:#07a35a;color:#fff;font-size:16px;font-weight:700}
button:disabled{opacity:.6}
#msg{margin-top:12px;padding:10px;border-radius:6px;font-size:13px;display:none;white-space:pre-wrap}
.ok{background:#e8f7ef;color:#0b7a45}.err{background:#fdecea;color:#a33}
</style></head><body><div class="wrap">
<h1>手动开奖 · 新彩种</h1>
<div class="hint">需要一次性粘贴 GitHub fine-grained PAT（仅本仓库 contents:write）。token 只存在本机浏览器 localStorage，不会上传到本站。</div>
<label>PAT</label><input id="token" type="password" placeholder="github_pat_...">
<label>期号</label><input id="issue" placeholder="如 2">
<label>6 个正码 + 1 特码</label><input id="nums" placeholder="01 12 23 34 45 06 18">
<label>生肖（可选，7 个）</label><input id="zodiacs" placeholder="留空自动按号码生成">
<label>开奖时间</label><input id="time" placeholder="如 11月17日 星期日 21:30">
<label>状态</label><select id="status"><option value="open">open（已开奖）</option><option value="sampled">sampled（示例）</option><option value="closed">closed（关闭）</option></select>
<button id="save">保存并发布（约 1–2 分钟生效）</button>
<div id="msg"></div>
<p class="hint" style="margin-top:14px">保存后 GitHub Pages 会自动重建；如 2 分钟后页面还是旧数据，刷新一次即可。</p>
</div>
<script>
(function(){
  var REPO='BYD666-WQ/xingchen-caixun', PATH='data/manual-draw.json', KEY='xc-gh-pat';
  var $=function(id){return document.getElementById(id)};
  var tok=$('token'); tok.value=localStorage.getItem(KEY)||'';
  function msg(t,ok){var m=$('msg');m.style.display='block';m.className=ok?'ok':'err';m.textContent=t}
  function b64(s){return btoa(unescape(encodeURIComponent(s)))}
  async function api(url,opt){opt=opt||{};opt.headers=Object.assign({'Authorization':'Bearer '+tok.value,'Accept':'application/vnd.github+json'},opt.headers||{});var r=await fetch(url,opt);var j=null;try{j=await r.json()}catch(e){}if(!r.ok)throw new Error((j&&j.message)||('HTTP '+r.status));return j}
  async function save(){
    if(!tok.value.trim()){msg('请先粘贴 PAT',false);return}
    localStorage.setItem(KEY,tok.value.trim());
    var nums=($('nums').value||'').trim().replace(/,/g,' ').split(/\s+/).filter(Boolean).map(function(n){return n.length<2?('0'+n):n});
    if(nums.length!==7){msg('号码必须是 7 个（6+1），当前 '+nums.length+' 个',false);return}
    var ZH=['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪'];
    var zs=($('zodiacs').value||'').trim().replace(/,/g,' ').split(/\s+/).filter(Boolean);
    if(zs.length!==7){zs=nums.map(function(n){return ZH[(parseInt(n,10)-1)%12]})}
    var body={name:'新彩种',issue:$('issue').value.trim(),nums:nums.map(function(n,i){return {c:n,z:zs[i]}}),drawTime:$('time').value.trim()||'待定',status:$('status').value,updated:new Date().toISOString()};
    var btn=$('save'); btn.disabled=true; btn.textContent='保存中…';
    try{
      var cur=null;
      try{cur=await api('https://api.github.com/repos/'+REPO+'/contents/'+PATH+'?ref=main')}catch(e){}
      var payload={message:'manual draw: issue '+body.issue,content:b64(JSON.stringify(body,null,1)),branch:'main'};
      if(cur&&cur.sha)payload.sha=cur.sha;
      await api('https://api.github.com/repos/'+REPO+'/contents/'+PATH,{method:'PUT',body:JSON.stringify(payload),headers:{'Content-Type':'application/json'}});
      msg('已提交！约 1–2 分钟后生效（期号 '+body.issue+'）',true);
    }catch(e){msg('失败：'+e.message,false)}
    btn.disabled=false; btn.textContent='保存并发布（约 1–2 分钟生效）';
  }
  $('save').addEventListener('click',save);
})();
</script></body></html>
