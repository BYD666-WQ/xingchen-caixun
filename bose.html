<h1>波色五行对照表</h1>
<div class="sub">按站内 1–49 号属性表整理：红波 17 个、蓝波 16 个、绿波 16 个，每个号码同时标注生肖与五行。波色/五行为传统民俗分类，仅供参考，不构成投注建议。</div>
<div id="wrap"><div class="block"><div class="hd"><b>加载中…</b></div><div class="bd"><span class="sk" style="width:60%"></span></div></div></div>
<div class="note">数据来源：站内公开属性表 <b>data/num-attrs.json</b>（49 条，已校验 1–49 无缺号）。同一号码的生肖随年份变化，本表为当前站内口径；五行/波色为固定分类。</div>
<div class="nav"><a href="index.html">首页</a><a class="on" href="ziliao.html">资料大全</a><a href="guilv.html">规律走势</a><a href="index.html">寻宝</a><a href="gallery.html">图库</a></div>
<script>
(function(){var S=['https://raw.githubusercontent.com/BYD666-WQ/xingchen-caixun/main/','https://cdn.jsdelivr.net/gh/BYD666-WQ/xingchen-caixun@main/',''];
function get(p){var i=0,NAMES=['raw','jsdelivr','local'];function go(){if(i>=S.length)return Promise.reject(new Error('x'));var k=i;var u=S[i++]+p+'?t='+Date.now();try{window.__dataOrder=window.__dataOrder||[];window.__dataOrder.push({try:NAMES[k]||String(k),path:p});console.log('[data-order] try '+(NAMES[k]||k)+' '+p)}catch(e){}return fetch(u,{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json().then(function(j){try{window.__dataOrder.push({hit:NAMES[k]||String(k),path:p});console.log('[data-order] hit '+(NAMES[k]||k)+' '+p)}catch(e){}return j})}).catch(function(){try{window.__dataOrder.push({fail:NAMES[k]||String(k),path:p})}catch(e){}return go()})}return go()}
function empty(){document.getElementById('wrap').innerHTML='<div class="block"><div class="hd"><b>暂无数据</b></div><div class="bd">属性表加载失败，请稍后刷新重试。</div></div>'}
function cls(c){return c==='红'?'r':(c==='蓝'?'b':'g')}
get('data/num-attrs.json').then(function(data){
  var rows=(data&&data.rows||[]).slice().sort(function(a,b){return parseInt(a.num,10)-parseInt(b.num,10)});
  if(rows.length!==49){empty();return}
  var byColor={红:[],蓝:[],绿:[]},byWx={金:[],木:[],水:[],火:[],土:[]};
  rows.forEach(function(r){if(!byColor[r.color])byColor[r.color]=[];byColor[r.color].push(r);if(byWx[r.wuxing])byWx[r.wuxing].push(r)});
  var chips='<span class="chip">共 49 码</span>';
  ['红','蓝','绿'].forEach(function(c){chips+='<span class="chip">'+c+'波<b>'+(byColor[c]||[]).length+'</b></span>'});
  Object.keys(byWx).forEach(function(w){chips+='<span class="chip">'+w+'<b>'+byWx[w].length+'</b></span>'});
  var html='<div class="block"><div class="hd"><b>速览</b><em>按颜色 / 五行计数</em></div><div class="bd"><div class="chips">'+chips+'</div></div></div>';
  ['红','蓝','绿'].forEach(function(c){
    var list=byColor[c]||[];
    html+='<div class="block bose-block" id="bose-'+c+'"><div class="hd"><b>'+c+'波号码</b><em>'+list.length+' 个</em></div><table class="bt"><colgroup><col style="width:22%"><col style="width:24%"><col style="width:22%"><col style="width:32%"></colgroup><thead><tr><th>号码</th><th>生肖</th><th>五行</th><th>别名</th></tr></thead><tbody>';
    list.forEach(function(r){html+='<tr class="bose-row"><td><span class="n '+cls(r.color)+'">'+r.num+'</span></td><td>'+r.zodiac+'</td><td><b>'+r.wuxing+'</b></td><td>'+r.name+'</td></tr>'});
    html+='</tbody></table></div>';
  });
  var wxRows='';
  ['金','木','水','火','土'].forEach(function(w){
    var nums=(byWx[w]||[]).map(function(r){return r.num}).join(' ');
    wxRows+='<div class="row"><i>'+w+'</i><span style="font-size:14px;letter-spacing:1px">'+nums+'</span><em>'+(byWx[w]||[]).length+' 码</em></div>';
  });
  html+='<div class="block"><div class="hd"><b>五行速查</b><em>号码归类</em></div><div class="rows">'+wxRows+'</div></div>';
  document.getElementById('wrap').innerHTML=html;
}).catch(empty)})();
</script>
