<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light">
<title>区块对齐 · 顶部+期开条+首个开奖块</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#F5F1E6;font-family:"Microsoft YaHei",Arial,sans-serif;color:#222}
.wrap{max-width:720px;margin:0 auto}
/* 广告位占位（不搬内容，只留比例） */
.adslot{height:56px;background:#EFE7CE;display:flex;align-items:center;justify-content:center;color:#b9a97c;font-size:12px;border-bottom:1px solid #e3d9bd}
/* 公告条 */
.notice{display:flex;align-items:center;gap:8px;background:#F7F7F7;padding:6px 10px;font-size:14px;color:#E60012}
.notice b{flex:1;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.notice .view{background:#2680EB;color:#fff;border-radius:999px;padding:3px 14px;font-size:12px}
/* LOGO */
.logo-row{display:flex;align-items:center;padding:8px 10px 6px}
.logo{font:900 30px/1.1 "Microsoft YaHei",Arial,sans-serif;color:#F60829}
.logo small{font-size:18px;color:#1E5BC6;font-weight:900}
.seal{margin-left:auto;background:#E60012;color:#fff;border:2px solid #F0C860;border-radius:6px;font-size:14px;font-weight:900;padding:5px 7px;text-align:center;line-height:1.2}
/* tab 药丸 */
.tabs{display:flex;gap:8px;padding:6px 10px 10px}
.tab{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:#fff;border:1px solid #E3DCC9;border-radius:999px;padding:8px 0;font-size:15px;font-weight:700;color:#333}
.tab .ico{width:28px;height:28px;border-radius:50%;border:1px solid #d5cba9;object-fit:cover;object-position:center;background:#fff}
.tab.on{background:#fff;border-color:#F6C65B;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.tab.on .ico{background:radial-gradient(circle at 35% 35%,#ff8a8a,#E60012)}
/* 期开条 */
.openbar{display:flex;align-items:center;gap:4px;padding:4px 6px;width:100%;box-sizing:border-box;background:#FFF3C4;border-top:1px solid #F6C65B;border-bottom:1px solid #F6C65B}
.openbar .left{flex:0 0 48px;font-size:11px;line-height:1.05;text-align:center;background:#FFE58A;border-radius:4px;color:#B30000;font-weight:700;padding:2px 0}
.openbar .left span{font-size:11px;font-weight:400}
.openbar .balls{display:flex;align-items:center;gap:4px;flex:1 1 0;min-width:0}
.openbar .refresh{flex:0 0 10px;width:auto;font-size:0;background:#FFD24D;border-radius:3px}
/* 方形球瓷砖 */
.tile{width:52px;height:52px;border-radius:8px;overflow:hidden;display:flex;flex-direction:column;color:#fff;text-align:center}
.openbar .tile.sm{flex:1 1 0;min-width:0;aspect-ratio:1;height:auto;width:auto;border-radius:4px}
.tile.sm .num{font-size:16px}
.tile.sm .zod{height:10px;font-size:9px}
.openbar .balls{gap:4px}
.openbar{padding:8px 4px;gap:4px}
.openbar .left{width:52px;padding:2px 2px;font-size:12px;flex:0 0 52px}
.openbar .refresh{width:16px;font-size:0;background:#FFD24D;border-radius:4px}
.tile .num{flex:1;display:flex;align-items:center;justify-content:center;font:900 26px/1 "Microsoft YaHei",Arial,sans-serif}
.tile .zod{height:22px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;background:rgba(0,0,0,.42)}
.tile.r{background:#E71607}.tile.b{background:#2383E9}.tile.g{background:#1FB61D}
.plus{align-self:center;color:#C8A24A;font-weight:900;font-size:18px}
/* 开奖块 */
.block{background:#fff;border:1px solid #F1D9A6;border-radius:6px;margin:10px;overflow:hidden}
.block .hd{display:flex;align-items:baseline;gap:10px;padding:8px 10px 4px;background:#fff;text-align:left}
.block .hd b{font-size:22px;font-weight:900;color:#222}
.block .hd .time{margin-left:auto;color:#888;font-size:15px}
.block .hd .hist{color:#E60012;font-size:16px;font-weight:700}
.block .balls{display:flex;align-items:center;gap:6px;padding:4px 10px 8px}
.block .next{display:flex;align-items:center;justify-content:space-between;padding:2px 10px 10px;font-size:14px;color:#333;width:100%}
.block .next .rf{background:#F5A623;color:#fff;border-radius:6px;padding:5px 12px;font-size:14px}
.openbar .tile.sm .num{font-size:clamp(13px,4.2vw,18px)}
.openbar .tile.sm .zod{height:9px;font-size:8px}
.openbar .plus{flex:0 0 10px}
.tab .ico{width:20px;height:20px;border-radius:50%;background:#fff;border:1px solid #d5cba9;position:relative;display:inline-block;font-size:0}
.tab .ico::after{content:'';position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%}
.tab:nth-child(1) .ico::after{background:#E60012}
.tab:nth-child(2) .ico::after{background:#2383E9}
.tab:nth-child(3) .ico::after{background:#1FB61D}
</style></head><body><div class="wrap">
<div class="adslot">（广告位占位 · 保持比例，不搬内容）</div>
<div class="notice"><b>本站数据仅供参考 · 开奖结果以官方公布为准</b><span class="view">查看</span></div>
<div class="logo-row"><div class="logo">新港摇钱树<small>.com</small></div><div class="seal">正版<br>数据</div></div>
<div class="tabs"><div class="tab on"><span class="ico"></span>新港</div><div class="tab"><span class="ico"></span>新澳</div><div class="tab"><span class="ico"></span>香港</div></div>
<div class="openbar">
  <div class="left">314期开<span>开奖记录</span></div>
  <div class="balls">
    <div class="tile sm r"><div class="num">13</div><div class="zod">马</div></div><div class="tile b"><div class="num">26</div><div class="zod">蛇</div></div><div class="tile b"><div class="num">09</div><div class="zod">狗</div></div><div class="tile b"><div class="num">37</div><div class="zod">马</div></div><div class="tile r"><div class="num">34</div><div class="zod">鸡</div></div><div class="tile g"><div class="num">44</div><div class="zod">猪</div></div><span class="plus">+</span><div class="tile b"><div class="num">31</div><div class="zod">鼠</div></div>
  </div>
  <div class="refresh">刷新</div>
</div>
<div class="block">
  <div class="hd"><b>新港第313期</b><span class="time">18:11:37</span><span class="hist">历史记录</span></div>
  <div class="balls">
    <div class="tile sm r"><div class="num">28</div><div class="zod">兔</div></div><div class="tile b"><div class="num">26</div><div class="zod">蛇</div></div><div class="tile r"><div class="num">12</div><div class="zod">羊</div></div><div class="tile g"><div class="num">11</div><div class="zod">猴</div></div><div class="tile r"><div class="num">30</div><div class="zod">牛</div></div><div class="tile r"><div class="num">07</div><div class="zod">鼠</div></div><span class="plus">+</span><div class="tile r"><div class="num">13</div><div class="zod">马</div></div>
  </div>
  <div class="next"><span>新港第314期: 11月11日 星期三 21:34</span><span class="rf">刷新</span></div>
</div>
</div></body></html>
