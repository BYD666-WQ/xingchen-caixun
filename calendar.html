<h1>开奖日历</h1>
<div class="sub">按站内时间表生成<b>未来 7 天（含今天）</b>的开奖安排：新港每天 21:34、新澳每天 21:30、香港每周二/四/六 21:30（北京时间）。只列站内已确认时间的彩种。</div>
<div class="block"><div class="hd"><b>未来 7 天</b><em id="cal-range">加载中…</em></div><table class="bt" id="cal-table"><colgroup><col style="width:24%"><col style="width:16%"><col style="width:20%"><col style="width:20%"><col style="width:20%"></colgroup><thead><tr><th>日期</th><th>星期</th><th>新港</th><th>新澳</th><th>香港</th></tr></thead><tbody id="cal-body"><tr><td colspan="5" style="padding:14px"><span class="sk" style="width:70%"></span></td></tr></tbody></table></div>
<div class="note">说明：① 时间为北京时间，按站内 TIME_TABLE 生成，实际以官方公布为准；② 香港彩只在每周二、四、六开奖，其余日期标「—」；③ 日历只服务查看，不代表任何投注安排。</div>

<script>
(function(){
var TT={新港:'21:34',新澳:'21:30',香港:'21:30'};
var DAYS={新港:[0,1,2,3,4,5,6],新澳:[0,1,2,3,4,5,6],香港:[2,4,6]};
var WD=['日','一','二','三','四','五','六'];
function p2(x){return (x<10?'0':'')+x}
var now=new Date();var base=new Date(now.getFullYear(),now.getMonth(),now.getDate());
var rows='';var first=null,last=null;
for(var i=0;i<7;i++){
  var t=new Date(base.getTime()+i*86400000);var dow=t.getDay();
  var date=(t.getMonth()+1)+'月'+t.getDate()+'日';
  if(i===0)first=date; if(i===6)last=date;
  var cells='';
  ['新港','新澳','香港'].forEach(function(k){
    var on=DAYS[k].indexOf(dow)>=0;
    cells+='<td class="'+(on?'cal-on':'cal-off')+'" data-kind="'+k+'">'+(on?TT[k]:'—')+'</td>';
  });
  rows+='<tr class="cal-row'+(i===0?' today':'')+'" data-dow="'+dow+'"><td><b>'+date+'</b>'+(i===0?'<span class="tag">今天</span>':'')+'</td><td>周'+WD[dow]+'</td>'+cells+'</tr>';
}
document.getElementById('cal-body').innerHTML=rows;
document.getElementById('cal-range').textContent=first+' – '+last;
window.__cal={rows:7,range:first+' – '+last,table:TT,days:DAYS};
})();
</script>
