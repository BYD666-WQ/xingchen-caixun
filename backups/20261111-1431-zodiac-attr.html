</style><style>.bd.p{font-size:14px;line-height:1.8;color:#333}.bd.p b{color:#8A0000}.zcards{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.zcard{border:1px solid #E8D098;border-radius:4px;background:#FFFDF6;padding:7px 8px}.zcard .zt{font-size:18px;font-weight:900;color:#C90000;line-height:1.15;margin-bottom:5px}.zcard .zt em{font-style:normal;font-size:11px;color:#8a6a3a;font-weight:400;margin-left:5px}.zn{display:flex;flex-wrap:wrap;gap:4px}.zn b{font-weight:800;font-size:13px;color:#fff;border-radius:3px;padding:2px 4px;line-height:1.3;box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}.zn b i{font-style:normal;font-size:10px;opacity:.9;margin-left:2px}.zn b.r{background:linear-gradient(160deg,#FF3B30,#C00012)}.zn b.b{background:linear-gradient(160deg,#2E86FF,#0B4EA2)}.zn b.g{background:linear-gradient(160deg,#2ECC71,#0B7A3A)}</style></head><body><header>新港摇钱树 · 生肖属性表<a href="index.html">返回首页</a></header>
<h1>生肖属性表</h1>
<div class="sub">12 生肖对应的 1–49 号码，号码底色为波色（红/蓝/绿），角标小字为五行。全部按站内公开属性表生成，静态资料，仅供参考。</div>
<div class="block"><div class="hd"><b>生肖 × 号码</b><em id="zod-count">加载中…</em></div><div class="bd" id="zod-wrap"><span class="sk" style="width:80%"></span></div></div>
<div class="note">说明：每个生肖 4 个号码，马为 5 个（含 49），合计 49 码无重复；生肖随年份变化，本表为当前站内口径。五行/波色为传统民俗分类，不具预测效力。</div>
<div class="nav"><a href="index.html">首页</a><a class="on" href="ziliao.html">资料大全</a><a href="guilv.html">规律走势</a><a href="index.html">寻宝</a><a href="gallery.html">图库</a></div>
<script>
(function(){var S=['','https://cdn.jsdelivr.net/gh/BYD666-WQ/xingchen-caixun@main/','https://raw.githubusercontent.com/BYD666-WQ/xingchen-caixun/main/'];
function get(p){var i=0;function go(){if(i>=S.length)return Promise.reject(new Error('x'));var u=S[i++]+p+'?v='+Math.floor(Date.now()/30000);return fetch(u,{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json()}).catch(go)}return go()}
function empty(){document.getElementById('zod-wrap').innerHTML='暂无数据（属性表未加载）';document.getElementById('zod-count').textContent='暂无数据'}
var ORDER=['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪'];
get('data/num-attrs.json').then(function(data){
  var rows=(data&&data.rows||[]);if(rows.length!==49){empty();return}
  var g={};ORDER.forEach(function(z){g[z]=[]});
  rows.forEach(function(r){if(g[r.zodiac])g[r.zodiac].push(r)});
  var html='<div class="zcards">';
  ORDER.forEach(function(z){
    var list=g[z].sort(function(a,b){return parseInt(a.num,10)-parseInt(b.num,10)});
    html+='<div class="zcard"><div class="zt">'+z+'<em>'+list.length+' 码</em></div><div class="zn">';
    list.forEach(function(r){var cls=r.color==='红'?'r':(r.color==='蓝'?'b':'g');html+='<b class="'+cls+'">'+r.num+'<i>'+r.wuxing+'</i></b>'});
    html+='</div></div>';
  });
  html+='</div>';
  document.getElementById('zod-wrap').innerHTML=html;
  document.getElementById('zod-count').textContent='12 生肖 · 49 码';
  window.__zod={zodiacs:ORDER.length,numbers:rows.length};
}).catch(empty)})();
</script>
