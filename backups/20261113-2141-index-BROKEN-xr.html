  function place(){var box=document.getElementById('xc-blocks3');if(!box)return;var anchor=document.getElementById('xc-blocks2')||document.getElementById('wuxiao')||document.getElementById('nm-final');var nav=document.querySelector('.nav');if(anchor&&anchor.parentNode){if(anchor.nextSibling!==box)anchor.parentNode.insertBefore(box,anchor.nextSibling);return}if(nav&&nav.parentNode&&box.nextSibling!==nav)nav.parentNode.insertBefore(box,nav)}
  function mount(){var box=document.getElementById('xc-blocks3');if(box)return box;box=document.createElement('div');box.id='xc-blocks3';var a=document.getElementById('xc-blocks2')||document.getElementById('wuxiao')||document.getElementById('nm-final');if(a&&a.parentNode)a.parentNode.insertBefore(box,a.nextSibling);else{var nav=document.querySelector('.nav');if(nav)nav.parentNode.insertBefore(box,nav)}return box}
  Promise.all([get('data/qiwei.json'),get('data/sisha.json'),get('data/pingte.json'),get('data/danshuangsixiao.json')]).then(function(rs){
    var qw=rs[0],ss=rs[1],pt=rs[2],ds4=rs[3];
    var qwHtml=(qw&&qw.rows||[]).map(function(r){
      var sp=r.special||{};var wait=!sp.z;var tail=wait?-1:parseInt(sp.c,10)%10;
      var tails=String(r.tails||'').split('').map(function(d){return '<span class="t'+(d===String(tail)?' hit':'')+'">'+d+'</span>'}).join('');
      var hit=!wait&&String(r.tails||'').indexOf(String(tail))>=0;
      var res=wait?'':(hit?'准':'错');var resHtml=wait?'':'<span class="qw-res '+(hit?'ok':'no')+'">'+res+'</span>';
      return '<div class="qw-row" data-issue="'+r.issue+'" data-result="'+(wait?'?':res)+'"><b>'+r.issue+'期</b>：<span class="qw-name">七尾中特</span><span class="qw-tails">{'+tails+'}</span> <span class="qw-open">特开：'+(wait?'?':(sp.z+sp.c))+'</span> '+resHtml+'</div>';
    }).join('');
    var ssHtml='<div class="ss-hd"><b>新港摇钱树【死杀三肖】</b></div>'+(ss&&ss.rows||[]).map(function(r){
      var sp=r.special||{};var wait=!sp.z;var hit=!wait&&(r.sisha||[]).indexOf(sp.z)<0;
      var res=wait?'':(hit?'中':'错');var resHtml=wait?'':'<span class="ss-res '+(hit?'ok':'no')+'">'+res+'</span>';
      return '<div class="ss-row" data-issue="'+r.issue+'" data-result="'+(wait?'?':res)+'"><b>'+r.issue+'期</b>：<span class="ss-name">死杀三肖</span><span class="ss-sisha">【'+(r.sisha||[]).join('')+'】</span> <span class="ss-open">特开：'+(wait?'?':(sp.z+sp.c))+'</span> '+resHtml+'</div>';
    }).join('');
    var ptHtml=(pt&&pt.rows||[]).map(function(r){
      var sp=r.special||{};var wait=!sp.z;var hit=!wait&&sp.z===r.zod;
      var zodTxt=r.zod?(r.zod+r.zod+r.zod):'待定';
      var res=wait?'':(hit?'准':'错');var resHtml=wait?'':'<span class="pt-res '+(hit?'ok':'no')+'">'+res+'</span>';
      return '<div class="pt-row" data-issue="'+r.issue+'" data-result="'+(wait?'?':res)+'"><b>'+r.issue+'期</b>：<span class="pt-name">平特①肖</span><span class="pt-zod'+(hit?' hit':'')+'">【'+zodTxt+'】</span> <span class="pt-open">开：'+(wait?'?':(sp.z+sp.c))+'</span> '+resHtml+'</div>';
    }).join('');
    var ds4Html='<div class="ds4-hd">单双四肖</div>'+(ds4&&ds4.rows||[]).map(function(r){
      var sp=r.special||{};var wait=!sp.z;var num=wait?0:parseInt(sp.c,10);var isDan=!wait&&num%2===1;
      var grp=wait?[]:(isDan?(r.dan||[]):(r.shuang||[]));var hit=!wait&&grp.indexOf(sp.z)>=0;
      var res=wait?'':(hit?'中':'错');var resHtml=wait?'':'<span class="ds4-res '+(hit?'ok':'no')+'">'+res+'</span>';
      function zs(list){return '<span class="ds4-grp">【'+list.map(function(z){var on=!wait&&z===sp.z&&(isDan?(r.dan||[]):(r.shuang||[])).indexOf(z)>=0;return '<span class="ds4-z'+(on?' hit':'')+'">'+z+'</span>'}).join('')+'】</span>'}
      var l1='<b>'+r.issue+'期</b>：<span class="ds4-name">单双四肖</span> <span class="ds4-open">特开：'+(wait?'?':(sp.z+'<span class="num">'+sp.c+'</span>'))+'</span> '+resHtml;
      var l2='<span class="ds4-lab">单</span>'+zs(r.dan||[])+'<span class="ds4-lab">双</span>'+zs(r.shuang||[]);
      return '<div class="ds4-row" data-issue="'+r.issue+'" data-result="'+(wait?'?':res)+'"><div class="l1">'+l1+'</div><div class="ds4-l2">'+l2+'</div></div>';
    }).join('');
    var box=mount();
    box.innerHTML='<section class="xcblk" id="qiwei">'+qwHtml+'</section><section class="xcblk" id="sisha">'+ssHtml+'</section><section class="xcblk" id="pingte">'+ptHtml+'</section><section class="xcblk" id="ds4">'+ds4Html+'</section>';
    window.__blocks3={};
    place();setTimeout(place,400);setTimeout(place,1200);setTimeout(place,2400);setTimeout(place,4000);setTimeout(place,6000);
  }).catch(function(){});
})();
</script><script src="assets/js/subnav.js"></script><script id="xc-realtime">
(function(){
  if(window.__rtStarted)return;window.__rtStarted=1;
  var files=['data/draw.json','data/manual-draw.json','data/manual-ziliao.json'];
  var sig='',timer=null,delay=12000,fails=0,polls=0,updates=0,hiddenPolls=0,paused=false;
  window.__rtStats={polls:0,updates:0,lastDelay:12000,fails:0,hiddenPolls:0,lastErr:''};
  function stats(){var o=window.__rtStats||{};o.polls=polls;o.updates=updates;o.lastDelay=delay;o.fails=fails;o.hiddenPolls=hiddenPolls;o.lastErr=o.lastErr||'';window.__rtStats=o}
  function fetchJ(rel){var u=rel+(rel.indexOf('?')>=0?'&':'?')+'t='+Date.now();return fetch(u,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})}
  function getSig(j){var by={};(j[0].games||[]).forEach(function(g){by[g.rule]=g});return [j[0].updated,j[1].updated,j[2].updated,by.Macau&&by.Macau.issue,by.HongKong&&by.HongKong.issue,j[1].issue].join('|')}
  function runStored(text){try{var s=document.createElement('script');s.textContent=text;document.body.appendChild(s);s.parentNode&&s.parentNode.removeChild(s)}catch(e){}}
  var stored=[];
  function capture(){
    [].forEach.call(document.querySelectorAll('script:not([src])'),function(s){
      var t=s.textContent||'';
      if(t.length>800&&t.indexOf('__rtStats')<0&&t.indexOf('xc-realtime')<0&&(t.indexOf('nm-final')>=0||t.indexOf('历史开奖记录')>=0||t.indexOf('xc-blocks2')>=0||t.indexOf('xc-blocks3')>=0||t.indexOf('wuxiao.json')>=0))stored.push(t);
    });
  }
  function poll(){
    if(paused)return;
    polls++;
    Promise.all(files.map(fetchJ)).then(function(j){
      var s=getSig(j);
      if(sig&&s!==sig){
        updates++;
        if(window.__applyDraw)window.__applyDraw(j[0],j[1]);
        stored.forEach(runStored);
      }
      sig=s;fails=0;delay=12000;stats();window.__rtDebug={polls:polls,sig:s,fetched:j[0].updated+'/'+j[0].games[0].issue,updates:updates};schedule();
    }).catch(function(e){
      fails++;window.__rtStats.lastErr=String(e&&e.message||e);
      delay=fails===1?30000:60000;stats();schedule();
    });
  }
  function schedule(){if(timer)clearTimeout(timer);if(paused)return;timer=setTimeout(poll,delay);stats()}
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='hidden'){paused=true;if(timer)clearTimeout(timer);hiddenPolls++;}
    else{paused=false;delay=12000;poll();}
    stats();
  });
  window.__rtTick=function(){poll()};
  window.__rtStoredCount=function(){return stored.length};
  capture();
  // first check establishes signature; do not render yet
  Promise.all(files.map(fetchJ)).then(function(j){sig=getSig(j);stats();schedule()}).catch(function(){schedule()});
})();
</script>


<script id="xc-block-rules">
(function(){
  /* 统一规则（2026-11-13 晚）：
     1) 排序：所有板块统一按 issue 数字升序（旧上→新下）；只在这一个 sortAsc 里排序，渲染后立即重排一次。
     2) 连续未中按段删行：按升序扫描已开奖行，段长≥2 整段删除（段长1保留）；待开/未知跳过不打断。
     3) 最多展示最新 10 期：过滤后若超过 10 行，丢弃最老的前 N 行。
     顺序：排序 → 删连续未中段 → 取最新10 → 保持升序展示。 */
  var SEL=['#nm-final','#wuxiao','#santou','#shuangbo','#danshuang','#liuxiao','#qiwei','#sisha','#pingte','#ds4'];
  var ROW='.row:not(.xc-stat):not(.xc-note),.wx-row,.st-row,.sb-row,.ds-row,.lx-row,.qw-row,.ss-row,.pt-row,.ds4-row';
  var SELJ=SEL.join(',');
  function rowsOf(sec){return [].slice.call(sec.querySelectorAll(ROW)).filter(function(r){return r.closest(SELJ)===sec})}
  function issueOf(row){var v=row.getAttribute('data-issue');if(v===null||v===''){var m=(row.textContent||'').match(/(\d{1,3})\s*期/);v=m?m[1]:''}var n=parseInt(v,10);return isFinite(n)?n:0}
  function sortAsc(rows){return rows.slice().sort(function(a,b){return issueOf(a)-issueOf(b)})}
  function resultOf(row){
    if(row.classList.contains('upcoming'))return null;
    var dr=String(row.getAttribute('data-result')||'').trim();
    if(dr==='错'||dr==='未中'||dr==='肖未')return false;
    if(dr==='对'||dr==='准'||dr==='肖中')return true;
    if(row.querySelector('u.miss'))return false;
    if(row.querySelector('u.hit'))return true;
    var txt=(row.textContent||'');
    if(/未中|肖未/.test(txt))return false;
    if(/准|肖中/.test(txt))return true;
    return null;
  }
  function reorder(sec,rows){
    var sorted=sortAsc(rows);
    var cur=rows.map(function(r){return issueOf(r)}).join(',');
    var want=sorted.map(function(r){return issueOf(r)}).join(',');
    if(cur===want)return sorted;
    var anchor=sec.querySelector('.xc-stat,.xc-note');
    var frag=document.createDocumentFragment();
    sorted.forEach(function(r){frag.appendChild(r)});
    if(anchor)sec.insertBefore(frag,anchor);else sec.appendChild(frag);
    return sorted;
  }
  function apply(){
    SEL.forEach(function(sel){
      var sec=document.querySelector(sel);if(!sec)return;
      var rows=reorder(sec,rowsOf(sec));
      var settled=rows.map(function(r){return {row:r,res:resultOf(r)}}).filter(function(x){return x.res!==null});
      var i=0;
      while(i<settled.length){
        if(settled[i].res===false){
          var j=i;while(j<settled.length&&settled[j].res===false)j++;
          if(j-i>=2){for(var k=i;k<j;k++){var r=settled[k].row;if(r.parentNode)r.parentNode.removeChild(r)}}
          i=j;
        }else i++;
      }
      rows=rowsOf(sec);
      if(rows.length>10){rows.slice(0,rows.length-10).forEach(function(r){r.parentNode&&r.parentNode.removeChild(r)})}
      sec.style.display='';
      sec.setAttribute('data-xc-sorted','1');
    });
  }
  var t=null;new MutationObserver(function(){clearTimeout(t);t=setTimeout(apply,120)}).observe(document.body,{childList:true,subtree:true});
  apply();setTimeout(apply,800);setTimeout(apply,2000);setInterval(apply,3000);
})();
</script>
