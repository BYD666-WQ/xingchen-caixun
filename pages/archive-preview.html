<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>存档接线验证 · 新站-复刻</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../assets/css/archive-index.css" data-archive-css>
<link rel="stylesheet" href="../assets/css/base.css">
<script src="../assets/js/archive-map.js"></script>
</head>
<body>
<div class="skel-bar"><div class="wrap">
  <span>存档接线验证页 · 不是正式页面</span>
  <span>目的：证明存档 CSS / 图片 / 字体能按本地路径加载</span>
</div></div>
<header class="skel-head"><div class="wrap">
  <div class="skel-brand"><span class="dot"></span>新站-复刻<small>preview</small></div>
  <nav class="skel-nav">
    <a href="../index.html">首页</a>
    <a href="detail.html">二级页 A</a>
    <a href="info.html">二级页 B</a>
    <a href="archive-preview.html" class="on">存档验证</a>
  </nav>
</div></header>
<main class="wrap">
  <h1>存档资源接线状态</h1>
  <p class="lead">本页按存档原始顺序加载 33 个样式表，并从 archive-map 里取前几张图片显示。图片能显示 = 路径改写和复制都正确。</p>
  <section class="panel">
    <h2>状态</h2>
    <div class="wiring" id="wiring">loading...</div>
  </section>
  <section class="panel">
    <h2>存档图片抽样（前 12 张）</h2>
    <div id="sample-imgs" style="display:flex;flex-wrap:wrap;gap:12px"></div>
    <p class="lead" style="margin-top:12px">如果图裂了，说明该资源在存档里缺失（见 import-report.md 缺失清单），不是我编的。</p>
  </section>
</main>
<footer class="skel-foot"><div class="wrap">存档接线验证 · 仅开发用</div></footer>
<script src="../assets/js/site.js"></script>
<script>
(function () {
  App.base = '../';
  var map = window.ARCHIVE_ASSETS || {};
  var keys = Object.keys(map);
  var imgs = keys.filter(function (k) { return /\.(png|jpe?g|gif|webp|svg|ico)$/i.test(k); }).slice(0, 12);
  var wrap = document.getElementById('sample-imgs');
  wrap.innerHTML = imgs.map(function (k) {
    return '<figure style="margin:0;max-width:140px">' +
      '<img src="' + App.asset(k) + '" alt="" style="max-width:140px;max-height:90px;border:1px solid #ddd;background:#fff">' +
      '<figcaption style="font:10px/1.3 Consolas,monospace;color:#6C7887;word-break:break-all">' + k.split('/').pop() + '</figcaption></figure>';
  }).join('') || '<p>没有图片资源</p>';
  var box = document.getElementById('wiring');
  box.textContent = [
    'archive-assets : ' + keys.length + ' entries',
    'archive-css    : ' + (window.ARCHIVE_CSS || []).length + ' stylesheet(s), loaded in order',
    'sample-imgs    : ' + imgs.length + ' rendered above'
  ].join(String.fromCharCode(10));
})();
</script>
</body>
</html>
