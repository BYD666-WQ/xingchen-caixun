<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>新港摇钱树</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:light}
html,body{background:#f7f3e8 !important;color:#333 !important}
body{margin:0;background:#f7f4ee;font-family:"Microsoft YaHei",Arial,sans-serif;color:#333}
#wrap{max-width:720px;margin:0 auto;padding:12px 10px 28px}
h1{font:900 27px/1.3 "Microsoft YaHei",Arial,sans-serif;color:#c0392b;text-align:center;margin:6px 0 4px}
.sub{text-align:center;color:#999;font-size:12px;margin-bottom:12px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;min-height:46px;border:1px solid #d8ccb4;border-radius:10px;background:#fff;font:700 16px "Microsoft YaHei",Arial,sans-serif;color:#333}
.tabs button.on{background:#c0392b;border-color:#c0392b;color:#fff}
.card{background:#fffdf6;border:1px solid #e8dcc8;border-radius:10px;padding:12px 10px;margin-bottom:10px;text-align:center}
.card h2{font:700 17px/1.6 "Microsoft YaHei",Arial,sans-serif;color:#c0392b;margin:0 0 4px}
.card .meta{font-size:12px;color:#888;margin-bottom:8px}
.balls{display:flex;flex-wrap:wrap;justify-content:center}
.ball{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;color:#fff;margin:3px;font:700 15px/1 system-ui,"Microsoft YaHei",Arial,sans-serif}
.ball i{font-style:normal;font-size:9px;opacity:.85;margin-top:1px}
.cd{margin-top:8px;font:700 13px "Microsoft YaHei",Arial,sans-serif;color:#1f3b8a}
.upd{font-size:11px;color:#aaa;margin-top:4px}

/* ===== 复刻旧站外观 ===== */
body{background:#f5efd8 !important}
h1{background:linear-gradient(#c32323,#8f1414);color:#ffe08a !important;font-size:22px;padding:10px 0;margin:-12px -10px 6px;-webkit-text-size-adjust:100%}
.sub{background:#F7F7F7!important;color:#7a5c1e;margin-bottom:10px}
.tabs button{background:#fffdf3;border:1px solid #d9c48a;border-radius:999px;position:relative;padding-left:26px}
.tabs button::before{content:"";position:absolute;left:10px;top:50%;transform:translateY(-50%);width:12px;height:12px;border-radius:50%;background:#d9a441}
.tabs button.on{background:#b51f1f;border-color:#8f1414;color:#fff}
.tabs button.on::before{background:#ffe08a}
.card{border:1px solid #d9c48a;background:#fffdf3;box-shadow:0 1px 0 #fff inset}
.card h2{background:linear-gradient(#d42d2d,#a81212);color:#ffe08a;margin:-12px -10px 8px;padding:8px 0;border-radius:8px 8px 0 0;font-size:17px}
.ball{box-shadow:0 0 0 2px #f6d97a inset;font-weight:900}
.cd{color:#8f1414}
#ziliao{border:1px solid #d9c48a;background:#fffdf3}
#ziliao h2{background:linear-gradient(#d42d2d,#a81212) !important;color:#ffe08a !important;margin:-10px -10px 8px !important;padding:8px 0 !important;border-radius:8px 8px 0 0 !important;font-weight:700 !important}
.zrow{border-top:1px dashed #e6d7ad}
#bottomnav{position:fixed;left:0;right:0;bottom:0;height:52px;display:flex;background:#fffdf3;border-top:1px solid #d9c48a;z-index:99}
#bottomnav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:#8a6d3b;text-decoration:none}
#bottomnav a i{font-style:normal;font-size:16px;line-height:1}
#bottomnav a.on{color:#b51f1f;font-weight:700}
#wrap{padding-bottom:70px}
@media (prefers-color-scheme: dark){html,body{background:#f5efd8 !important;color:#333 !important}}

#nemi,#hist,#more-sec{margin-top:14px;background:#fffdf3;border:1px solid #d9c48a;border-radius:10px;padding:10px}
#nemi h2,#hist h2,#more-sec h2{background:linear-gradient(#d42d2d,#a81212) !important;color:#ffe08a !important;margin:-10px -10px 8px !important;padding:8px 0 !important;border-radius:8px 8px 0 0 !important;text-align:center;font-size:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.nrow{border:1px solid #e6d7ad;border-radius:6px;padding:6px;font-size:12px;background:#fff}
.nrow b{color:#b51f1f}
.hitem{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-top:1px dashed #e6d7ad}
.mlist{display:flex;gap:8px;justify-content:space-around;font-size:12px;color:#7a5c1e;padding:6px 0}
.hlink{margin-top:6px}
.hlink button{min-height:32px;border:1px solid #d9c48a;background:#fffdf3;border-radius:999px;color:#8f1414;font-size:12px;padding:0 12px}
#ziliao{margin-top:14px;background:#fffdf6;border:1px solid #e8dcc8;border-radius:10px;padding:10px}
#ziliao h2{font:700 16px "Microsoft YaHei",Arial,sans-serif;color:#c0392b;margin:0 0 8px;text-align:center}
.zrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px;padding:5px 0;border-top:1px dashed #eee;font:13px/1.5 "Microsoft YaHei",Arial,sans-serif}
.zrow .iss{color:#666;font-size:12px}
.zrow .zs span{display:inline-block;min-width:20px;text-align:center;color:#c00;font-weight:700}
.zrow .code{color:#666 !important;font-size:12px;margin-left:4px;font-weight:400}
.pending{color:#a33;font-weight:700}
.err{color:#a33;text-align:center;padding:8px}
</style>

<style id="xc-l1-skin">

.card,.tabs button,#bottomnav{border:1px solid #F6C65B!important;box-shadow:0 0 0 1px #FFD878 inset!important}
.card{background-image:linear-gradient(#FFFEF5,#FFEDCB)!important}
#ziliao,#nemi,#hist{background-image:linear-gradient(#FFF7E3,#FFE8B8)!important}

</style>

.tabs button{background-image:url("assets/theme/纹理/9f6ee3c7-BDB76B.webp")!important;background-size:cover!important;background-blend-mode:screen!important}

</style></head><body><div id="wrap">
<h1>新港摇钱树</h1>
<div class="sub">官方开奖信息 · 每 30 秒刷新</div>
<div class="tabs" id="tabs">
  <button data-k="newhk" class="on">新港</button>
  <button data-k="newmo">新澳</button>
  <button data-k="hk">香港</button>
</div>
<div id="panels"></div>
<div id="nemi"><h2>内幕 · 单双③肖</h2><div id="nm" class="grid"></div></div>
<div id="hist"><h2>历史开奖</h2><div id="hs"></div></div>
<div id="ziliao"><h2>资料大全</h2><div id="zl"></div></div>
<div id="guilv"><h2>规律走势</h2><div id="gl"></div></div>
<div id="tuku"><h2>图库</h2><div class="mlist">图库图片整理中，稍后开放（数据文件已就绪）</div></div>
</div>
<div class="xc-gallery" style="display:flex;gap:6px;padding:8px;background:#FFF4D7;border-top:1px solid #FFCC58"><img src="assets/theme/图库缩略/64d4b287-tjb311.webp" style="width:48%;border:1px solid #F6C65B;border-radius:6px"><img src="assets/theme/图库缩略/b554f6c9-tjb313.jpg" style="width:48%;border:1px solid #F6C65B;border-radius:6px"></div>
<div id="bottomnav">
  <a href="/xingchen-caixun/" class="on"><i>🏠</i>首页</a>
  <a href="#ziliao"><i>📚</i>资料大全</a>
  <a href="#guilv"><i>📈</i>规律走势</a>
  <a href="#ziliao"><i>🔍</i>寻宝</a>
  <a href="#tuku"><i>🖼️</i>图库</a>
</div>
<script>
(function(){
  var SRC = ['https://cdn.jsdelivr.net/gh/BYD666-WQ/xingchen-caixun@main/','https://raw.githubusercontent.com/BYD666-WQ/xingchen-caixun/main/',''];
  function get(p){
    var ps = [];
    for (var i=0;i<SRC.length;i++) ps.push(fetch(SRC[i]+p+'?v='+Math.floor(Date.now()/30000),{cache:'no-store'}).then(function(r){ if(!r.ok) throw 0; return r.json(); }));
    return Promise.any ? Promise.any(ps) : new Promise(function(res,rej){ var n=0; ps.forEach(function(x){ x.then(res).catch(function(){ if(++n===ps.length) rej(new Error('all fail')); }); }); });
  }
  var R=[1,2,7,8,12,13,18,19,23,24,29,30,34,35,40,45,46], B=[3,4,9,10,14,15,20,25,26,31,36,37,41,42,47,48];
  function color(v){ return R.indexOf(v)>=0?'#e71607':(B.indexOf(v)>=0?'#2873e6':'#1fb61d'); }
  function balls(nums){
    return (nums||[]).slice(0,7).map(function(n){
      return '<span class="ball" style="background:'+color(parseInt(n.c,10))+'">'+n.c+'<i>'+(n.z||'')+'</i></span>';
    }).join('');
  }
  function cdText(dailyTime){
    if(!dailyTime) return '';
    var hm=String(dailyTime).split(':');
    var now=new Date(), t=new Date(now.getFullYear(),now.getMonth(),now.getDate(),parseInt(hm[0],10),parseInt(hm[1],10),0);
    if(t<=now) t=new Date(t.getTime()+86400000);
    var left=Math.floor((t.getTime()-Date.now())/1000);
    function p(n){return (n<10?'0':'')+n;}
    var d=Math.floor(left/86400);
    return '距开奖 '+(d>0?d+'天':'')+p(Math.floor(left%86400/3600))+':'+p(Math.floor(left%3600/60))+':'+p(left%60);
  }
  var state={tab:'newhk',data:null};
  function render(){
    var d=state.data||{};
    var draw=d.draw||{}, manual=d.manual||{}, zl=d.zl||{};
    var byRule={}; (draw.games||[]).forEach(function(g){byRule[g.rule]=g;});
    var cards=[];
    function card(key,name,issue,nums,extra,daily){
      if(issue===undefined||issue===null) return;
      cards.push('<div class="card '+(state.tab===key?'':'hide')+'"><h2>'+name+' 第'+issue+'期</h2>'+extra+'<div class="balls">'+balls(nums)+'</div>'+(daily?'<div class="cd">'+cdText(daily)+'</div>':'')+'</div>');
    }
    card('newhk','新港',manual.issue,manual.nums,manual.drawTime?('<div class="meta">'+manual.drawTime+'</div>'):'',manual.dailyTime);
    if(byRule.Macau) card('newmo','新澳',byRule.Macau.issue,byRule.Macau.nums,'<div class="meta">每天 21:30</div>','21:30');
    if(byRule.HongKong) card('hk','香港',byRule.HongKong.issue,byRule.HongKong.nums,'<div class="meta">每天 21:30</div>','21:30');
    if(!cards.length) cards.push('<div class="err">数据获取中…</div>');
    document.getElementById('panels').innerHTML=cards.join('');
    Array.prototype.forEach.call(document.querySelectorAll('#panels .card'),function(c,i){ c.style.display = (['newhk','newmo','hk'][i]===state.tab)?'':'none'; });
    // 资料
    var rows=zl.rows||[]; var out=[];
    var pool=[];
    rows.forEach(function(r){(r.threeZodiac||[]).forEach(function(z){if(pool.indexOf(z)<0)pool.push(z);});});
    pool=pool.concat(['\u9f20','\u725b','\u864e','\u5154','\u9f99','\u86c7','\u9a6c','\u7f8a','\u7334','\u9e21','\u72d7','\u732a']).slice(0,7);
    var cur=(rows.filter(function(r){return r.status!=='upcoming';})[0]||rows[0]||{});
    var hn=(manual.nums||[]).map(function(x){return x.c;});
    [7,5,3,2,1].forEach(function(n){
      out.push('<div class="zrow"><span class="iss">'+n+'肖</span><span class="zs">'+pool.slice(0,n).map(function(z){return '<span>'+z+'</span>';}).join('')+'</span><span class="code">码:'+hn.slice(0,n).join('.')+'</span></div>');
    });
    out.push('<div class="zrow" style="border-top:1px solid #e6d7ad;margin-top:4px"></div>');
    var OUT_TMP=[];
    rows.slice(0,6).forEach(function(r){
      var c=r.result&&r.result.c;
      if(!c||c==='NaN'||r.status==='upcoming'){ out.push('<div class="zrow"><span class="iss">新港'+r.issue+'期</span><span class="pending">【待开】</span></div>'); return; }
      var hn = (manual.nums||[]).map(function(x){return x.c;});
      var codes = (r.status==='live' && String(r.issue)===String(manual.issue)) ? hn.join('.') : '';
      out.push('<div class="zrow"><span class="iss">新港'+r.issue+'期</span><span class="zs">'+ (r.threeZodiac||[]).map(function(z){return '<span>'+z+'</span>';}).join('') +'</span>'+(codes?'<span class="code">码:'+codes+'</span>':'')+'</div>');
    });
    document.getElementById('zl').innerHTML = out.length? out.join('') : '<div class="err">资料加载中…</div>';
    var gl=document.getElementById('gl');
    if(gl){ gl.innerHTML=(rows.slice(0,8).map(function(r){
      var c=r.result&&r.result.c; var ok=(c&&c!=='NaN'&&r.status!=='upcoming');
      return '<div class="hitem"><span>新港'+r.issue+'期 '+(r.oddEven==='双'?'双数':'单数')+' '+((r.threeZodiac||[]).join(''))+'</span><span>'+(ok?('开 '+r.result.z+c):'待开')+'</span></div>';
    }).join('')) || '<div class="err">暂无数据</div>'; }
    // 内幕九宫格
    var nm=document.getElementById('nm');
    if(nm){
      nm.innerHTML=rows.slice(0,6).map(function(r){
        var c=r.result&&r.result.c;
        var ok=(c&&c!=='NaN');
        if(!ok) return '<div class="nrow"><b>新港'+r.issue+'期</b> <span style="color:#a33">【待开】</span></div>';
        return '<div class="nrow"><b>新港'+r.issue+'期</b> '+(r.oddEven==='双'?'【双数】':'【单数】')+
          ' 主【'+(r.threeZodiac||[]).join('')+'】 开 '+r.result.z+c+' <b>准</b></div>';
      }).join('');
    }
    // 历史开奖（最近 10 期）
    var hs=document.getElementById('hs');
    if(hs){
      var his=[];
      if(draw.games){ draw.games.forEach(function(g){ if(g.rule==='MacauOld'||g.rule==='Happy8') return; his.push({t:g.rule==='Macau'?'新澳':'香港',issue:g.issue,nums:g.nums}); }); }
      if(manual.nums) his.unshift({t:'新港',issue:manual.issue,nums:manual.nums});
      hs.innerHTML=his.slice(0,10).map(function(x){
        return '<div class="hitem"><span>'+x.t+' 第'+x.issue+'期</span><span>'+ (x.nums||[]).slice(0,7).map(function(n){return n.c}).join(' ')+'</span></div>';
      }).join('');
    }
    // 每卡历史入口
    Array.prototype.forEach.call(document.querySelectorAll('#panels .card'),function(c){
      if(c.querySelector('.hlink')) return;
      var d=document.createElement('div'); d.className='hlink';
      d.innerHTML='<button type="button">历史记录</button>';
      d.querySelector('button').addEventListener('click',function(){
        var his=document.getElementById('hist'); if(his){ his.scrollIntoView({behavior:'smooth',block:'start'}); }
      });
      c.appendChild(d);
    });
  }
  function load(){
    Promise.all([get('data/draw.json').catch(function(){return null;}),get('data/manual-draw.json').catch(function(){return null;}),get('data/manual-ziliao.json').catch(function(){return null;})]).then(function(r){
      state.data={draw:r[0]||{},manual:r[1]||{},zl:r[2]||{}};
      render();
    });
  }
  Array.prototype.forEach.call(document.querySelectorAll('#tabs button'),function(b){
    b.addEventListener('click',function(){
      state.tab=b.getAttribute('data-k');
      Array.prototype.forEach.call(document.querySelectorAll('#tabs button'),function(x){x.classList.toggle('on',x===b);});
      render();
    });
  });
  load(); setInterval(load,30000);
})();
</script></body></html>
