<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><title>新港摇钱树</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Microsoft YaHei",Arial,sans-serif;padding-bottom:64px}
.notice{text-align:center;font-size:13px;padding:6px;background:#FFF3C4;color:#8a3a00;border-bottom:1px solid #E8C86A}
header{display:flex;align-items:center;padding:10px 12px;background:linear-gradient(#E60012,#C90000)}
.logo{font:900 26px/1.15 "Microsoft YaHei";color:#FFD24D;text-shadow:1px 1px 0 #7A0000,-1px -1px 0 #7A0000,1px -1px 0 #7A0000,-1px 1px 0 #7A0000;letter-spacing:1px}
.seal{margin-left:auto;border:1px solid #FFD24D;color:#FFD24D;border-radius:4px;font-size:12px;padding:4px 7px}
.tabs{display:flex;gap:0;background:#FFFDF3;border-bottom:2px solid #E60012}
.tabs a{flex:1;text-align:center;padding:9px 0;font-size:17px;font-weight:700;color:#8a4a00;border-right:1px solid #F0DCA8;text-decoration:none}
.tabs a.on{background:#E60012;color:#FFD24D}
.openbar{display:flex;align-items:center;gap:5px;padding:6px 6px;background:#FFF3C4;border-top:2px solid #E0B94A;border-bottom:2px solid #E0B94A}
.ol{flex:0 0 56px;font:900 20px/1.05 "Microsoft YaHei";color:#C90000;text-align:center}
.ol span{display:block;font-size:12px;color:#8a4a00;font-weight:700}
.ob{display:flex;gap:4px;flex:1;min-width:0;align-items:center}
.tile{flex:1 1 0;min-width:0;aspect-ratio:1;border-radius:4px;overflow:hidden;color:#fff;display:flex;flex-direction:column;text-align:center;border:1px solid rgba(0,0,0,.15)}
.tile .num{flex:1;display:flex;align-items:center;justify-content:center;font:800 26px/1 "Microsoft YaHei"}
.tile .zod{height:17px;line-height:17px;font-size:13px;background:rgba(0,0,0,.42)}
.r{background:#E60012}.b{background:#1E5BC6}.g{background:#0F8A34}
.plus{flex:0 0 8px;color:#C90000;font-weight:900;text-align:center;font-size:16px}
.card{margin:8px 8px;background:#FFFDF3;border:2px solid #E0B94A;border-radius:5px;overflow:hidden}
.card .hd{display:flex;align-items:baseline;gap:6px;padding:8px 10px;background:#E60012;border-bottom:2px solid #FFD24D}
.card .hd b{font-size:24px;color:#FFD24D;font-weight:900}
.card .hd .t{font-size:14px;color:#FFE9A8}
.card .hd .h{margin-left:auto;font-size:15px;color:#FFD24D;font-weight:700}
.balls{display:flex;gap:5px;padding:8px 10px;align-items:center}
.balls .tile{width:48px;height:56px;flex:0 0 auto}
.balls .tile .num{font-size:26px}
.balls .tile .zod{height:18px;line-height:18px;font-size:14px}
.next{display:flex;justify-content:space-between;align-items:center;padding:6px 10px 10px;font-size:15px;color:#6b4a10;border-top:1px dashed #E8D098}
.next .rf{background:#FFD24D;color:#C90000;border-radius:4px;padding:5px 12px;font-size:15px;font-weight:800;border:1px solid #C9A227}
.mini{margin:8px 8px;background:#FFFDF3;border:2px solid #E0B94A;border-radius:5px;overflow:hidden}
.mini h5{margin:0;background:#E60012;color:#FFD24D;font:900 22px/1.9 "Microsoft YaHei";text-align:center;border-bottom:2px solid #FFD24D;letter-spacing:1px}
.mini .row{display:flex;gap:6px;align-items:center;padding:8px 8px;border-top:1px dashed #E8D098;font-size:19px}
.mini .row:first-of-type{border-top:0}
.mini i{font-style:normal;background:#E60012;color:#fff;border-radius:3px;padding:2px 6px;font-size:15px;font-weight:700}
.mini b{color:#C90000;font-size:16px}
.mini u{margin-left:auto;text-decoration:none;background:#FFD24D;color:#C90000;border-radius:3px;padding:2px 8px;font-size:16px;font-weight:900;border:1px solid #C9A227}
.nav{position:fixed;left:0;right:0;bottom:0;height:56px;display:flex;background:#8A0000;border-top:2px solid #FFD24D}
.nav a{flex:1;text-align:center;line-height:56px;font-size:14px;color:#FFD24D;text-decoration:none;font-weight:700}
.nav a.on{background:#C90000;color:#fff}.mini h5{background-image:linear-gradient(#E60012,#B3000E)!important;background-clip:border-box!important;-webkit-background-clip:border-box!important;color:#FFD24D!important;-webkit-text-fill-color:#FFD24D!important;text-shadow:0 1px 0 #7A0000}
.openbar{padding:3px 4px!important;gap:3px!important}
.openbar .ol{flex:0 0 48px!important;font-size:18px!important}
.openbar .ol span{font-size:11px!important}
.openbar .ob{gap:3px!important}
.openbar .plus{flex:0 0 4px!important;font-size:14px!important}
</style></head><body><div class="notice">本站数据仅供参考 · 开奖结果以官方公布为准</div>
<header><div class="logo">新港摇钱树</div><div class="seal">正版</div></header>
<nav class="tabs"><a class="on">新港</a><a>新澳</a><a>香港</a></nav>
<div class="openbar"><div class="ol">314期开<span>开奖记录</span></div><div class="ob"><div class="tile r"><div class="num">28</div><div class="zod">兔</div></div><div class="tile b"><div class="num">26</div><div class="zod">蛇</div></div><div class="tile r"><div class="num">12</div><div class="zod">羊</div></div><div class="tile g"><div class="num">11</div><div class="zod">猴</div></div><div class="tile r"><div class="num">30</div><div class="zod">牛</div></div><div class="tile r"><div class="num">07</div><div class="zod">鼠</div></div><span class="plus">+</span><div class="tile r"><div class="num">13</div><div class="zod">马</div></div></div></div>
<section class="card"><div class="hd"><b>新港第313期</b><span class="t">19:07</span><span class="h">历史记录</span></div><div class="balls"><div class="tile r"><div class="num">28</div><div class="zod">兔</div></div><div class="tile b"><div class="num">26</div><div class="zod">蛇</div></div><div class="tile r"><div class="num">12</div><div class="zod">羊</div></div><div class="tile g"><div class="num">11</div><div class="zod">猴</div></div><div class="tile r"><div class="num">30</div><div class="zod">牛</div></div><div class="tile r"><div class="num">07</div><div class="zod">鼠</div></div><span class="plus">+</span><div class="tile r"><div class="num">13</div><div class="zod">马</div></div></div><div class="next"><span>明天 21:34 开奖</span><span class="rf">刷新</span></div></section>
<section class="mini"><h5>内幕 · 单双③肖</h5>
<div class="row"><i>313期</i><b>【单数】</b><span>主【兔蛇羊】</span><em>开马13</em><u>准</u></div>
<div class="row"><i>312期</i><b>【单数】</b><span>主【猪羊虎】</span><em>开鼠07</em><u>准</u></div>
<div class="row"><i>311期</i><b>【单数】</b><span>主【鼠兔鸡】</span><em>开龙39</em><u>准</u></div>
</section>
<div id="xc-extra"></div>
<div class="nav"><a class="on">首页</a><a>资料大全</a><a>规律走势</a><a>寻宝</a><a>图库</a></div><script>
(function(){
  var SRC=['https://cdn.jsdelivr.net/gh/BYD666-WQ/xingchen-caixun@main/','https://raw.githubusercontent.com/BYD666-WQ/xingchen-caixun/main/',''];
  function get(p){var i=0;function go(){if(i>=SRC.length)return Promise.reject(new Error('x'));var u=SRC[i++]+p+'?v='+Math.floor(Date.now()/30000);return fetch(u,{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json()}).catch(go)}return go()}
  Promise.all([get('data/manual-draw.json'),get('data/manual-ziliao.json')]).then(function(r){
    var md=r[0]||{},zl=r[1]||{},rows=(zl.rows||[]).slice(0,12);
    var ex=document.getElementById('xc-extra');if(!ex)return;
    var nmi=rows.map(function(d){var c=d.result&&d.result.c,ok=(c&&c!=='NaN'&&d.status!=='upcoming');
      if(!ok)return '<div class="row"><i>'+d.issue+'期</i><b>【待开】</b></div>';
      return '<div class="row"><i>'+d.issue+'期</i><b>【'+(d.oddEven==='双'?'双数':'单数')+'】</b><span>主【'+((d.threeZodiac||[]).join(''))+'】</span><em>开'+(d.result.z||'')+c+'</em><u>准</u></div>';}).join('');
    var pool=[];rows.forEach(function(d){(d.threeZodiac||[]).forEach(function(z){if(pool.indexOf(z)<0)pool.push(z)})});
    pool=pool.concat(['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪']).slice(0,7);
    var hn=(md.nums||[]).map(function(x){return x.c});
    var zli=[7,5,3,2,1].map(function(n){return '<div class="row"><i>'+n+'肖</i><span>'+pool.slice(0,n).join('')+'</span><em>码:'+hn.slice(0,n).join('.')+'</em></div>'}).join('');
    var his=rows.slice(0,10).map(function(d){var c=d.result&&d.result.c,ok=(c&&c!=='NaN'&&d.status!=='upcoming');return '<div class="row"><i>'+d.issue+'期</i><span>'+(ok?((d.threeZodiac||[]).join('')+' 开'+(d.result.z||'')+c):'待开')+'</span></div>'}).join('');
    ex.innerHTML='<section class="mini"><h5>内幕 · 单双③肖</h5>'+nmi+'</section>'+
      '<section class="mini"><h5>资料大全</h5>'+zli+'</section>'+
      '<section class="mini"><h5>历史开奖记录</h5>'+his+'</section>';
  });
})();
</script></body></html>
