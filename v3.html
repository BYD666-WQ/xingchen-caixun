<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>新港摇钱树</title>
<style>
body{margin:0;background:#f7f4ee;font-family:"Microsoft YaHei",Arial,sans-serif}
#app{max-width:720px;margin:0 auto;padding:14px 10px}
#t{font:900 28px/1.3 "Microsoft YaHei",Arial,sans-serif;color:#c0392b;text-align:center}
#sub{text-align:center;color:#888;font-size:12px;margin:6px 0 10px}
#draw{text-align:center;font:700 14px/1.6 "Microsoft YaHei",Arial,sans-serif;color:#333}
#balls{display:flex;flex-wrap:wrap;justify-content:center;margin:8px 0}
#btns{display:flex;gap:8px;margin-top:10px}
#btns a{flex:1;min-height:46px;display:flex;align-items:center;justify-content:center;border:1px solid #d8ccb4;border-radius:10px;background:#fff;color:#333;font:700 16px "Microsoft YaHei",Arial,sans-serif;text-decoration:none}
#foot{text-align:center;padding:18px 0 26px;font-size:12px;color:#999}
#foot a{color:#07a35a;text-decoration:none;margin:0 8px}
</style></head><body><div id="app">
<div id="t">新港摇钱树</div>
<div id="sub">官方开奖信息 · 每日更新</div>
<div id="draw">最新开奖</div>
<div id="balls"></div>
<div id="btns">
  <a href="more.html?v=5">新港</a>
  <a href="more.html?v=5">新澳</a>
  <a href="more.html?v=5">香港</a>
</div>
<div id="foot"><a href="more.html?v=5">更多内容</a><a href="pages/ziliao.html?v=5">资料大全</a><a href="pages/guilv.html?v=5">规律走势</a></div>
</div>
<script>
(function(){
  var urls=['https://cdn.jsdelivr.net/gh/BYD666-WQ/xingchen-caixun@main/data/manual-draw.json',
            'https://raw.githubusercontent.com/BYD666-WQ/xingchen-caixun/main/data/manual-draw.json',
            'data/manual-draw.json'];
  function load(i){
    if(i>=urls.length){document.getElementById('draw').textContent='数据加载中…';return;}
    fetch(urls[i]+'?v='+Math.floor(Date.now()/60000),{cache:'no-store'})
      .then(function(r){return r.ok?r.json():load(i+1)})
      .then(function(d){
        if(!d||!d.nums) return load(i+1);
        document.getElementById('draw').textContent='新港第'+(d.issue||'')+'期开奖结果';
        var R=[1,2,7,8,12,13,18,19,23,24,29,30,34,35,40,45,46],B=[3,4,9,10,14,15,20,25,26,31,36,37,41,42,47,48];
        document.getElementById('balls').innerHTML=d.nums.slice(0,7).map(function(n){
          var v=parseInt(n.c,10);
          var bg=R.indexOf(v)>=0?'#e71607':(B.indexOf(v)>=0?'#2873e6':'#1fb61d');
          return '<span style="display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;background:'+bg+';color:#fff;margin:3px;font:700 15px/1 \'Microsoft YaHei\',Arial,sans-serif">'+n.c+'<i style="font-style:normal;font-size:9px;opacity:.85">'+(n.z||'')+'</i></span>';
        }).join('');
      }).catch(function(){load(i+1)});
  }
  load(0);
})();
</script></body></html>
